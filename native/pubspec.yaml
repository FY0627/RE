name: bk_native
description: "Native capabilities: Android floating-window screenshot + OCR, iOS App Intents."
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.bk_native
        pluginClass: BkNativePlugin
      ios:
        pluginClass: BkNativePlugin
