name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test app
        run: flutter test
        working-directory: app

      - name: Test native
        run: flutter test
        working-directory: native
